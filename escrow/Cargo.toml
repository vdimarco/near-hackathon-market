[package]
name = "lock-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sandbox escrow that follows the outcome of the jury contract."
repository = "https://github.com/vdimarco/near-hackathon-market"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
