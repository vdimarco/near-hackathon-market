name: check

# Runs every check that needs no key and no account: `make check`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rust-toolchain.toml selects the Rust version and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: make check
